<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (() => {
        let theme;
        try {
          const savedTheme = localStorage.getItem('aralna-theme');
          if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme;
        } catch (error) {
          console.warn('Unable to read the saved theme preference.', error);
        }
        document.documentElement.dataset.theme = theme || (
          matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        );
      })();
    </script>
    <title>AralNa</title>
    <link rel="icon" type="image/svg+xml" href="/aralna-mark.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
